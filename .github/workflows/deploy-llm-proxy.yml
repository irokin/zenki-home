name: Deploy AI butler LLM proxy

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AN_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$AN_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Set optional access code
        working-directory: worker
        env:
          CODE: ${{ secrets.ZENKI_ACCESS_CODE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CODE" ]; then printf '%s' "$CODE" | npx --yes wrangler@3 secret put ACCESS_CODE; else echo "No access code set"; fi

      - name: Point the page at the proxy
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOY_OUT: ${{ steps.deploy.outputs.command-output }}
          HAS_CODE: ${{ secrets.ZENKI_ACCESS_CODE != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="$DEPLOY_URL"
          if [ -z "$URL" ]; then URL=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1); fi
          if [ -z "$URL" ]; then echo "::error::Could not find the worker URL in the deploy output"; exit 1; fi
          echo "Proxy URL: $URL"
          jq --arg u "$URL" --argjson c "$HAS_CODE" '.proxyUrl=$u | .proxyNeedsCode=$c' config.json > config.tmp && mv config.tmp config.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          git commit -m "Point AI butler to deployed LLM proxy" || echo "config.json unchanged"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
